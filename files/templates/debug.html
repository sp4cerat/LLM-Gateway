<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Gateway — Debug View</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --dim: #8b949e; --green: #3dd68c;
  --blue: #58a6ff; --orange: #d29922; --red: #f85149;
  --purple: #bc8cff; --cyan: #39d2c0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 15px; color: var(--green); }
.header .stats { color: var(--dim); font-size: 12px; }
.controls { display: flex; gap: 8px; margin-left: auto; }
.controls button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
.controls button:hover { border-color: var(--green); }
.controls button.active { background: var(--green); color: var(--bg); border-color: var(--green); }

.container { padding: 12px; max-width: 1400px; margin: 0 auto; }

.entry { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.entry.expanded .entry-body { display: block; }
.entry-header { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.entry-header:hover { background: rgba(255,255,255,0.03); }
.entry-body { display: none; border-top: 1px solid var(--border); }

.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.tag.tier-cheap { background: rgba(61,214,140,0.15); color: var(--green); }
.tag.tier-cheap_plus { background: rgba(57,210,192,0.15); color: var(--cyan); }
.tag.tier-medium { background: rgba(88,166,255,0.15); color: var(--blue); }
.tag.tier-premium { background: rgba(188,140,255,0.15); color: var(--purple); }
.tag.cost { background: rgba(210,153,34,0.15); color: var(--orange); }
.tag.tools { background: rgba(248,81,73,0.15); color: var(--red); }
.tag.agent { background: rgba(188,140,255,0.15); color: var(--purple); }
.tag.web { background: rgba(57,210,192,0.15); color: var(--cyan); }
.tag.code { background: rgba(248,81,73,0.15); color: var(--red); }

.entry-id { color: var(--dim); font-size: 11px; min-width: 60px; }
.entry-time { color: var(--dim); font-size: 11px; min-width: 50px; }
.entry-query { flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-arrow { color: var(--dim); margin-left: auto; transition: transform 0.2s; }
.entry.expanded .entry-arrow { transform: rotate(90deg); }

/* Body sections */
.section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-title { font-size: 11px; color: var(--green); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
.section pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.6; color: var(--text); background: var(--bg); padding: 10px; border-radius: 6px; max-height: 500px; overflow-y: auto; }
.section pre .role-system { color: var(--orange); }
.section pre .role-user { color: var(--green); }
.section pre .role-assistant { color: var(--blue); }
.section pre .role-tool { color: var(--purple); }
.section pre .role-developer { color: var(--red); }
.section pre .dim { color: var(--dim); }

.meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.meta-item { background: var(--bg); padding: 6px 10px; border-radius: 4px; }
.meta-item .label { font-size: 10px; color: var(--dim); text-transform: uppercase; }
.meta-item .value { font-size: 13px; color: var(--text); }

.response-box { background: var(--bg); padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; color: var(--blue); }

.empty { text-align: center; padding: 60px; color: var(--dim); }
.auto-refresh { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div class="header">
  <h1>🔬 Debug View</h1>
  <span class="stats" id="stats"></span>
  <span class="auto-refresh" id="refresh-status"></span>
  <div class="controls">
    <button onclick="toggleAutoRefresh()" id="auto-btn">Auto ⏸</button>
    <button onclick="loadData()">Refresh</button>
    <button onclick="toggleAll(true)">Expand All</button>
    <button onclick="toggleAll(false)">Collapse All</button>
  </div>
</div>
<div class="container" id="entries"></div>

<script>
const API_KEY = new URLSearchParams(location.search).get('key') || '';
let autoRefresh = false;
let autoTimer = null;
let data = [];

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('auto-btn');
  btn.textContent = autoRefresh ? 'Auto ▶' : 'Auto ⏸';
  btn.classList.toggle('active', autoRefresh);
  if (autoRefresh) {
    autoTimer = setInterval(loadData, 3000);
    document.getElementById('refresh-status').textContent = '(every 3s)';
  } else {
    clearInterval(autoTimer);
    document.getElementById('refresh-status').textContent = '';
  }
}

async function loadData() {
  try {
    const r = await fetch('/debug/data', {
      headers: { 'Authorization': 'Bearer ' + API_KEY }
    });
    if (!r.ok) { document.getElementById('entries').innerHTML = '<div class="empty">Auth failed ('+r.status+'). Add ?key=YOUR_GATEWAY_KEY to URL.</div>'; return; }
    data = await r.json();
    render();
  } catch(e) {
    document.getElementById('entries').innerHTML = '<div class="empty">Error: '+e.message+'</div>';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function tierClass(t) { return 'tier-' + (t||'cheap'); }

function renderMessages(msgs) {
  if (!msgs || !msgs.length) return '<span class="dim">(no messages)</span>';
  return msgs.map(m => {
    let prefix = `<span class="role-${m.role}">[${m.role}]</span>`;
    let extra = '';
    if (m.has_tc) extra += ` <span class="dim">→ tool_calls: [${(m.tc_names||[]).join(', ')}]</span>`;
    if (m.has_tid) extra += ` <span class="dim">(tool_result)</span>`;
    let content = esc(m.content || '').substring(0, 800);
    if (m.content && m.content.length > 800) content += '<span class="dim">…[truncated]</span>';
    return `${prefix}${extra}\n${content || '<span class="dim">(empty)</span>'}`;
  }).join('\n\n────────────────────────────────────────\n\n');
}

function render() {
  const el = document.getElementById('entries');
  if (!data.length) { el.innerHTML = '<div class="empty">No requests yet. Send a message to the gateway.</div>'; return; }
  
  document.getElementById('stats').textContent = `${data.length} requests`;
  
  el.innerHTML = data.map((e, i) => {
    const tierCls = tierClass(e.tier);
    const tags = [
      `<span class="tag ${tierCls}">${e.tier}/${(e.model||'?').split('/').pop()}</span>`,
      `<span class="tag cost">$${(e.cost_usd||0).toFixed(4)}</span>`,
      `<span class="tag">${e.tokens?.in||0}+${e.tokens?.out||0} tok</span>`,
    ];
    if (e.escalated) tags.push(`<span class="tag tools">⬆${e.escalated}</span>`);
    if (e.tools_used?.length) tags.push(`<span class="tag tools">🔧${e.tools_used.join(',')}</span>`);
    if (e.is_agent) tags.push(`<span class="tag agent">🤖agent</span>`);
    if (e.routing?.is_code) tags.push(`<span class="tag code">🔨code</span>`);
    if (e.routing?.needs_web) tags.push(`<span class="tag web">🌐web</span>`);
    if (e.response_tool_calls?.length) tags.push(`<span class="tag tools">→${e.response_tool_calls.join(',')}</span>`);
    if (e.quality) {
      const q = e.quality;
      const qColor = !q.answered ? '#e44' : q.confidence === 'low' ? '#e90' : q.confidence === 'medium' ? '#cc0' : '#4a4';
      const qLabel = !q.answered ? '❌' : q.confidence === 'high' ? '✅' : q.confidence === 'medium' ? '⚠️' : '🔻';
      tags.push(`<span class="tag" style="background:${qColor};color:#fff">${qLabel} ${q.confidence||'?'} (${q.source_count||0}src)</span>`);
    }
    
    return `<div class="entry" id="entry-${i}">
      <div class="entry-header" onclick="toggle(${i})">
        <span class="entry-time">${(e.ts||'').substring(11,19)}</span>
        ${tags.join(' ')}
        <span class="entry-query">${esc(e.query||'')}</span>
        <span class="entry-arrow">▶</span>
      </div>
      <div class="entry-body">
        <div class="section">
          <div class="section-title">Metadata</div>
          <div class="meta-grid">
            <div class="meta-item"><div class="label">Request ID</div><div class="value">${e.id||'?'}</div></div>
            <div class="meta-item"><div class="label">Tier / Model</div><div class="value">${e.tier} / ${(e.model||'?').split('/').pop()}</div></div>
            <div class="meta-item"><div class="label">Cost</div><div class="value">$${(e.cost_usd||0).toFixed(6)}</div></div>
            <div class="meta-item"><div class="label">Latency</div><div class="value">${e.latency_ms||0}ms</div></div>
            <div class="meta-item"><div class="label">Tokens (in/out/reason)</div><div class="value">${e.tokens?.in||0} / ${e.tokens?.out||0} / ${e.tokens?.reasoning||0}</div></div>
            <div class="meta-item"><div class="label">Escalated</div><div class="value">${e.escalated||'—'}</div></div>
            <div class="meta-item"><div class="label">Routing</div><div class="value">${e.routing?.action||'—'} → ${e.routing?.response_type||'—'}</div></div>
            <div class="meta-item"><div class="label">Agent</div><div class="value">${e.is_agent ? 'Yes' : 'No'}</div></div>
          </div>
        </div>
        ${e.system_prompt ? `<div class="section">
          <div class="section-title">System Prompt</div>
          <pre>${esc(e.system_prompt)}</pre>
        </div>` : ''}
        <div class="section">
          <div class="section-title">Messages → LLM (${e.messages?.length || 0} msgs)</div>
          <pre>${renderMessages(e.messages)}</pre>
        </div>
        ${e.web_enrichment ? `<div class="section">
          <div class="section-title">Web Enrichment</div>
          <pre>${esc(e.web_enrichment)}</pre>
        </div>` : ''}
        ${e.quality ? `<div class="section">
          <div class="section-title">Quality Assessment</div>
          <pre style="color:${e.quality.answered && e.quality.confidence!=='low' ? '#4a4' : '#e44'}">${JSON.stringify(e.quality, null, 2)}</pre>
        </div>` : ''}
        <div class="section">
          <div class="section-title">Response</div>
          <div class="response-box">${esc(e.response||'(empty)')}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i) {
  document.getElementById('entry-'+i)?.classList.toggle('expanded');
}
function toggleAll(expand) {
  document.querySelectorAll('.entry').forEach(e => e.classList.toggle('expanded', expand));
}

// Initial load
loadData();
</script>
</body>
</html>
